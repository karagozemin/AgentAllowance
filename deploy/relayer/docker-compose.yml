services:
  redis:
    image: redis:bookworm
    command: ["redis-server", "--appendonly", "yes"]
    security_opt: ["no-new-privileges"]
    volumes:
      - relayer_redis:/data

  relayer:
    image: openzeppelin/openzeppelin-relayer:1.7.0
    depends_on: [redis]
    ports:
      - "8080:8080"
    environment:
      APP_PORT: "8080"
      REDIS_URL: redis://redis:6379
      API_KEY: ${RELAYER_API_KEY}
      KEYSTORE_PASSPHRASE: ${RELAYER_KEYSTORE_PASSPHRASE}
      LOG_LEVEL: ${RELAYER_LOG_LEVEL:-info}
      LOG_MODE: stdout
      METRICS_ENABLED: "false"
    security_opt: ["no-new-privileges"]
    volumes:
      - ${RELAYER_RUNTIME_DIR}/config:/app/config:ro
      - ${RELAYER_RUNTIME_DIR}/plugin:/app/plugins/x402-facilitator:ro

volumes:
  relayer_redis:
