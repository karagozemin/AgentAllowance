[workspace]
resolver = "2"
members = [
  "contracts/treasury-account",
  "contracts/spending-limit-policy",
  "contracts/recipient-policy",
]
exclude = ["proofs/stellar-x402-smart-account"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.dependencies]
soroban-sdk = { version = "=26.1.0", features = ["experimental_spec_shaking_v2"] }
stellar-accounts = "=0.7.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
